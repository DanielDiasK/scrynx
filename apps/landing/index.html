<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Scrynx is the screenshot app that goes beyond the print key: any capture mode, pro annotations, OCR and a capture manager dashboard that keeps everything in its place."
    />
    <meta property="og:title" content="Scrynx — Capture. Annotate. Organize." />
    <meta
      property="og:description"
      content="The screenshot app with a built-in capture manager. Free for Windows."
    />
    <title>Scrynx — Capture. Annotate. Organize.</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("scrynx-theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html { background: #e8e6e2; }
      html.dark { background: #131318; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
