name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & release Scrynx (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install

      - name: Read version from tauri.conf.json
        id: read
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Target version: $v"

      - name: Skip when release v<version> already exists
        id: check
        shell: pwsh
        run: |
          $tag = "refs/tags/v${{ steps.read.outputs.version }}"
          $hit = git ls-remote --exit-code --tags origin $tag 2>&1
          if ($LASTEXITCODE -ne 0) {
            "released=true" >> $env:GITHUB_OUTPUT
            Write-Host "Will create release v${{ steps.read.outputs.version }}"
          } else {
            "released=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release already exists — skipping (bump the version to ship a new one)"
          }

      - name: Build & publish release via tauri-action
        if: steps.check.outputs.released == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Scrynx v__VERSION__
          releaseBody: |
            Scrynx v__VERSION__ — Windows (x64)

            Baixe o instalador desta release (asset `Scrynx_*_x64-setup.exe`).

            Este build é assinado com a chave de atualização do app (Tauri Updater).
          releaseDraft: false
          prerelease: false

  deploy-landing:
    name: Deploy landing to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build landing
        run: bun run build:landing

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
